<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrinaDX Web Monitor</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kanit', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f4f5f8 0%, #eaedf4 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #ffffff;
            padding: 28px 22px;
            border-radius: 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            text-align: left;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h2.title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0;
        }

        .btn-connect {
            background-color: #8e24aa;
            color: white;
            border: none;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(142, 36, 170, 0.25);
        }

        /* ปุ่มสั่งอ่านค่าสี */
        .btn-measure {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
            display: none; /* ซ่อนไว้ก่อน จะแสดงเมื่อเชื่อมต่อสำเร็จ */
        }

        .btn-measure:active {
            transform: scale(0.98);
        }

        .mode-container {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .mode-btn {
            flex: 1;
            padding: 11px;
            border: none;
            background: #f1edfb;
            color: #666666;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active-mode {
            background: #ab47bc;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(171, 71, 188, 0.3);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #2c2c2c;
            margin: 18px 0 10px 0;
        }

        .summary-box {
            background-color: #f7f4fd;
            border: 1px solid #e9dff7;
            padding: 16px 18px;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .summary-box span.val {
            color: #4a148c;
            font-size: 20px;
            font-weight: 800;
        }

        .rgb-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .rgb-badge {
            flex: 1;
            background-color: #f7f4fd;
            border: 1px solid #e9dff7;
            padding: 10px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #333333;
            text-align: center;
        }

        #status {
            margin-top: 22px;
            font-size: 12px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="app-header">
        <h2 class="title">🧪 UrinaDX</h2>
    </div>

    <button class="btn-connect" id="btnConnect" onclick="connectBLE()">🔗 เชื่อมต่อ Bluetooth</button>
    
    <!-- ปุ่มสั่งอ่านค่า จะเด้งขึ้นมาเมื่อเชื่อมต่อ BLE แล้ว -->
    <button class="btn-measure" id="btnMeasure" onclick="triggerRead()">🎯 กดเพื่อวัดค่าสาร</button>

    <div class="mode-container">
        <button id="btnNitrite" class="mode-btn active-mode" onclick="setMode('nitrite')">ไนไตรต์</button>
        <button id="btnProtein" class="mode-btn" onclick="setMode('protein')">โปรตีน</button>
    </div>

    <div class="section-title">ผลการวิเคราะห์</div>
    <div class="summary-box">
        <span id="labelText">ปริมาณไนไตรต์:</span>
        <span class="val" id="concDisplay">0.00 mg/L</span>
    </div>

    <div class="section-title">ข้อมูลสี (RGB)</div>
    <div class="rgb-container">
        <div class="rgb-badge" id="rDisplay">R: --</div>
        <div class="rgb-badge" id="gDisplay">G: --</div>
        <div class="rgb-badge" id="bDisplay">B: --</div>
    </div>

    <p id="status">สถานะ: ยังไม่ได้เชื่อมต่อ</p>
</div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleCharacteristic = null;
    let currentMode = 'nitrite'; 
    let lastR = 0, lastG = 0, lastB = 0;

    function setMode(mode) {
        currentMode = mode;
        const btnNitrite = document.getElementById("btnNitrite");
        const btnProtein = document.getElementById("btnProtein");

        if (mode === 'nitrite') {
            btnNitrite.className = "mode-btn active-mode";
            btnProtein.className = "mode-btn";
            document.getElementById("labelText").innerText = "ปริมาณไนไตรต์:";
        } else {
            btnProtein.className = "mode-btn active-mode";
            btnNitrite.className = "mode-btn";
            document.getElementById("labelText").innerText = "ปริมาณโปรตีน:";
        }
        
        updateCalculation();
    }

    function updateCalculation() {
        let result = 0;
        if (currentMode === 'nitrite') {
            result = (111.600 - lastG) / 75.407;
        } else {
            result = (156.530 - lastR) / 0.244;
        }

        if (result < 0) result = 0; 
        document.getElementById("concDisplay").innerText = result.toFixed(2) + " mg/L";
    }

    // ฟังก์ชันส่งคำสั่ง "READ" ไปยัง ESP32
    async function triggerRead() {
        if (bleCharacteristic) {
            try {
                const encoder = new TextEncoder();
                await bleCharacteristic.writeValue(encoder.encode("READ"));
                document.getElementById("status").innerText = "⏳ กำลังอ่านค่าสี...";
            } catch (error) {
                console.error("Trigger Error:", error);
                document.getElementById("status").innerText = "🔴 ส่งคำสั่งล้มเหลว";
            }
        }
    }

    async function connectBLE() {
        const statusText = document.getElementById("status");
        try {
            statusText.innerText = "กำลังค้นหาอุปกรณ์...";
            
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'NitriScan' }],
                optionalServices: [SERVICE_UUID]
            });

            statusText.innerText = "กำลังเชื่อมต่อกับ " + device.name + "...";
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            await bleCharacteristic.startNotifications();
            bleCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                const decoder = new TextDecoder('utf-8');
                const dataString = decoder.decode(event.target.value);
                
                const values = dataString.split(',');
                if (values.length >= 3) {
                    lastR = parseFloat(values[0]);
                    lastG = parseFloat(values[1]);
                    lastB = parseFloat(values[2]);

                    document.getElementById("rDisplay").innerText = `R: ${lastR.toFixed(2)}`;
                    document.getElementById("gDisplay").innerText = `G: ${lastG.toFixed(2)}`;
                    document.getElementById("bDisplay").innerText = `B: ${lastB.toFixed(2)}`;
                    
                    updateCalculation();
                    statusText.innerText = "🟢 อ่านค่าเรียบร้อย!";
                    statusText.style.color = "#2e7d32";
                }
            });

            statusText.innerText = "🟢 เชื่อมต่อสำเร็จ! กดปุ่มวัดค่าได้เลย";
            statusText.style.color = "#2e7d32";
            document.getElementById("btnMeasure").style.display = "block"; // แสดงปุ่มกดวัดค่า

        } catch (error) {
            console.error(error);
            statusText.innerText = "🔴 การเชื่อมต่อล้มเหลว";
            statusText.style.color = "#c62828";
        }
    }
</script>

</body>
</html>
