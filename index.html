<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NitriScan Web Monitor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 16px; max-width: 380px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        button { background-color: #007bff; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; }
        .result-group { margin: 15px 0; padding: 10px; background: #f8f9fa; border-radius: 10px; }
        .conc-title { font-size: 13px; color: #666; }
        .value-box { font-size: 28px; font-weight: bold; margin: 5px 0; }
        .nitrite-color { color: #28a745; }
        .protein-color { color: #17a2b8; }
        .rgb-box { background: #e9ecef; padding: 8px; border-radius: 8px; color: #333; font-size: 13px; font-weight: 500; }
        #status { margin-top: 15px; font-size: 13px; color: #888; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧪 NitriScan Monitor</h2>
    <button onclick="connectBLE()">🔗 เชื่อมต่ออุปกรณ์</button>

    <div class="result-group">
        <div class="conc-title">ความเข้มข้นไนไตรต์ (Nitrite)</div>
        <div class="value-box nitrite-color" id="nitriteDisplay">0.000</div>
    </div>

    <div class="result-group">
        <div class="conc-title">ความเข้มข้นโปรตีน (Protein)</div>
        <div class="value-box protein-color" id="proteinDisplay">0.000</div>
    </div>

    <div class="rgb-box" id="rgbDisplay">R: -- | G: -- | B: --</div>
    <p id="status">สถานะ: ยังไม่ได้เชื่อมต่อ</p>
</div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    async function connectBLE() {
        const statusText = document.getElementById("status");
        try {
            statusText.innerText = "กำลังค้นหาอุปกรณ์...";
            
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'NitriScan' }],
                optionalServices: [SERVICE_UUID]
            });

            statusText.innerText = "กำลังเชื่อมต่อกับ " + device.name + "...";
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', (event) => {
                const decoder = new TextDecoder('utf-8');
                const dataString = decoder.decode(event.target.value);
                
                // ข้อมูลที่รับมา: "R, G, B, Nitrite, Protein"
                const values = dataString.split(',');
                if (values.length >= 5) {
                    document.getElementById("rgbDisplay").innerText = `R: ${values[0]} | G: ${values[1]} | B: ${values[2]}`;
                    document.getElementById("nitriteDisplay").innerText = values[3];
                    document.getElementById("proteinDisplay").innerText = values[4];
                }
            });

            statusText.innerText = "🟢 เชื่อมต่อสำเร็จแล้ว!";
            statusText.style.color = "green";

        } catch (error) {
            console.error(error);
            statusText.innerText = "🔴 การเชื่อมต่อล้มเหลว";
            statusText.style.color = "red";
        }
    }
</script>

</body>
</html>
